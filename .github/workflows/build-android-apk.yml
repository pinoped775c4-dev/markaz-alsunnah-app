name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: markaz-alsunnah-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show download instructions
        run: |
          echo "## Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Build succeeded. Download **markaz-alsunnah-android-apk** from the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
