name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

jobs:
  build-apks:
    name: Build release APKs by CPU architecture
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload ARM64 APK (most modern Android phones)
        uses: actions/upload-artifact@v4
        with:
          name: markaz-alsunnah-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: markaz-alsunnah-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: markaz-alsunnah-x86-64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add sizes to workflow summary
        run: |
          echo "## Android APKs by architecture" >> "$GITHUB_STEP_SUMMARY"
          du -h build/app/outputs/flutter-apk/app-*-release.apk >> "$GITHUB_STEP_SUMMARY"
          echo "Choose ARM64 for most modern Android phones. The APK artifacts are available for 30 days." >> "$GITHUB_STEP_SUMMARY"
